<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BU11 Video Quizzes</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f3d24;color:#fff;padding:0 max(16px, env(safe-area-inset-left, 0px)) 40px}
header{text-align:center;padding:18px 12px 6px}
h1{margin:0;font-size:28px}
.sub{opacity:.85;font-size:15px;margin-top:6px}
main{max-width:720px;margin:0 auto}
h2{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin:22px 4px 10px}
a.quiz{display:flex;gap:14px;align-items:center;background:#fff;color:#111;text-decoration:none;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
a.quiz img{width:38%;max-width:240px;aspect-ratio:16/9;object-fit:cover;display:block;background:#000;flex:none}
.info{padding:12px 14px 12px 0;min-width:0}
.date{font-size:13px;font-weight:800;color:#0b6b35;letter-spacing:.5px;text-transform:uppercase}
.title{font-size:20px;font-weight:800;margin-top:2px;line-height:1.2}
.meta{font-size:14px;color:#555;margin-top:4px}
.prog{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;background:#eee;color:#444}
.prog.done{background:#2ecc71;color:#fff}.prog.part{background:#ffd400;color:#111}
a.quiz.latest{display:block}
a.quiz.latest img{width:100%;max-width:none}
a.quiz.latest .info{padding:14px 16px 16px}
a.quiz.latest .title{font-size:24px}
.new{display:inline-block;background:#ffd400;color:#111;font-weight:800;font-size:12px;letter-spacing:1px;padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:2px}
.go{display:inline-block;margin-top:10px;background:#0f3d24;color:#fff;font-weight:700;font-size:17px;padding:10px 16px;border-radius:12px}
</style></head><body>
<header>
  <h1>⚽ BU11 Video Quizzes</h1>
  <div class="sub">Real plays from our games. A new one each week after Coach's video.</div>
</header>
<main id="list"></main>
<script>
// Newest first. To add a quiz: put it in q/<date>/ and add one line at the top.
const QUIZZES = [
  {id:"2026-10-26", date:"Oct 26", title:"vs Albion SD", plays:10, week:4},
  {id:"2026-10-19", date:"Oct 19", title:"TFA + Surf games", plays:10, week:4},
];
const base=location.pathname.replace(/index\.html$/,'');
function progress(q){
  const res=JSON.parse(localStorage.getItem('bu11:'+base+'q/'+q.id+'/')||'{}');
  const tried=Object.keys(res).length, knew=Object.values(res).filter(v=>v===true).length;
  if(!tried) return `<span class="prog">Not started</span>`;
  if(knew===q.plays) return `<span class="prog done">✓ All ${q.plays} done</span>`;
  return `<span class="prog part">You knew ${knew} of ${q.plays}</span>`;
}
function card(q,latest){
  return `<a class="quiz${latest?' latest':''}" href="q/${q.id}/"><img src="q/${q.id}/thumb.jpg" alt="" loading="lazy">
  <div class="info"><div class="date">${q.date}${latest?'<span class="new">NEW</span>':''}</div>
  <div class="title">${q.title}</div>
  <div class="meta">${q.plays} plays · ${q.week} for this week + ${q.plays-q.week} bonus</div>
  ${progress(q)}${latest?'<div><span class="go">Start this week\'s quiz →</span></div>':''}</div></a>`;
}
document.getElementById('list').innerHTML=
  `<h2>This week</h2>`+card(QUIZZES[0],true)+
  (QUIZZES.length>1?`<h2>Earlier quizzes</h2>`+QUIZZES.slice(1).map(q=>card(q,false)).join(''):'');
</script></body></html>
