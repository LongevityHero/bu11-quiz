<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BU11 Video Quiz</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;font-size:16px;background:#0f3d24;color:#fff;min-height:100%;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{text-align:center;padding:14px 12px 10px}
h1{margin:0;font-size:26px}
.sub{opacity:.85;font-size:15px;margin-top:4px}
button{font-size:17px;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600}
#wrap{display:flex;gap:16px;max-width:1040px;margin:0 auto;padding-block:0 30px;align-items:flex-start}
nav{flex:0 0 108px;position:sticky;top:12px;background:#0b2e1b;border-radius:16px;padding:10px 8px}
nav .grp{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin:6px 4px 6px}
nav button{display:flex;align-items:center;gap:6px;width:100%;margin:0 0 6px;padding:8px 8px;background:#1d5c38;color:#fff;font-size:18px;border:3px solid transparent;text-align:left}
nav button .nm{font-size:10px;font-weight:700;opacity:.8;letter-spacing:.5px}
nav button .st{margin-left:auto;font-size:15px}
nav button.cur{border-color:#ffd400;background:#2a7a4b}
nav button.ok{background:#2ecc71}
nav button.no{background:#ff7a45}
#stage{flex:1;min-width:0}
.progress{text-align:center;font-size:15px;opacity:.85;margin-bottom:8px}
.face{background:#fff;color:#111;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
video{width:100%;display:block;background:#000}
.tag{display:inline-block;background:#ffd400;color:#111;font-weight:800;letter-spacing:1px;font-size:13px;padding:4px 10px;border-radius:8px}
.tag.ans{background:#2ecc71;color:#fff}
.txt{padding:14px 16px 18px}
.q{font-size:22px;font-weight:700;margin-top:8px;line-height:1.25}
.a{font-size:22px;font-weight:700;margin-top:8px;line-height:1.3;color:#0b6b35}
.one{margin-top:14px;background:#fff6c2;border-left:6px solid #ffd400;border-radius:10px;padding:10px 14px}
.one .lbl{font-size:13px;font-weight:800;letter-spacing:.5px;color:#7a6200;text-transform:uppercase}
.one .big{font-size:24px;font-weight:800;margin-top:4px;line-height:1.25}
.hint{font-size:14px;color:#666;margin-top:8px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.yes{background:#2ecc71;color:#fff}.no{background:#ff7a45;color:#fff}.w{background:#fff;color:#0f3d24}.g{background:#1d5c38;color:#fff}
.nav2{display:flex;justify-content:space-between;gap:10px}
.nav2 button{background:transparent;color:#fff;border:2px solid #2a7a4b;font-size:15px;padding:8px 14px}
.nav2 button:disabled{opacity:.3;cursor:default}
.done{text-align:center;background:#fff;color:#111;border-radius:18px;padding:30px 20px}
.done .big{font-size:56px}
.ones{text-align:left;max-width:520px;margin:14px auto;font-size:18px;line-height:1.5}
#loading{text-align:center;padding:40px;font-size:18px}
@media (max-width:640px){
  #wrap{flex-direction:column;gap:10px}
  nav{position:static;width:100%;flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px}
  nav .grp{display:none}
  nav button{width:auto;min-width:0;justify-content:center;margin:0;padding:8px 4px}
  nav button .st{margin-left:0}
  nav button .nm{display:none}
}
</style></head><body>
<header>
  <h1>⚽ Video Quiz</h1>
  <div class="sub">Real plays from our game vs Albion SD. Watch, guess out loud, then see what Coach drew.</div>
  <div class="sub"><a href="earlier.html" style="color:#ffd400">Earlier quiz (TFA + Surf games) →</a></div>
</header>
<div id="wrap"><nav id="nav"></nav><div id="stage"></div></div>
<script>
const CARDS = [{"n": 1, "one": "Face the field, not the sideline.", "ring": true, "hint": "", "cue": "BODY", "q": "It's our throw-in. Look at our players in white getting the ball. Which way are they facing?", "a": "Toward the sideline. Turn your body to face the inside of the field. Then you can see the goal and go. They weren't ready!", "week": true, "fu": "v2/c1_front.mp4", "bu": "v2/c1_back.mp4"}, {"n": 2, "one": "Winning? Slow down and get set.", "ring": true, "hint": "", "cue": "READY", "q": "Our goal kick, and we're winning 2-1. Are we ready?", "a": "No. We're walking and rushing the kick. Slow down. Get set up, talk to each other, and tell Charlie to wait.", "week": true, "fu": "v2/c2_front.mp4", "bu": "v2/c2_back.mp4"}, {"n": 3, "one": "First touch into space, then pass.", "ring": true, "hint": "", "cue": "TOUCH", "q": "The ball is coming to our player in white. What makes a good first touch?", "a": "A soft touch into space, away from their player. Then look up and pass. A sloppy touch gives it away.", "week": true, "fu": "v2/c3_front.mp4", "bu": "v2/c3_back.mp4"}, {"n": 4, "one": "Don't get beat inside.", "ring": true, "hint": "", "cue": "INSIDE", "q": "Their player is dribbling at us. Which way should we NOT let him go?", "a": "Don't let him go inside, to the middle. Push him to the sideline. If he gets inside, our other defenders get pulled over and holes open up.", "week": true, "fu": "v2/c4_front.mp4", "bu": "v2/c4_back.mp4"}, {"n": 5, "one": "Ball first, then shield.", "ring": false, "hint": " Watch our players in white.", "cue": "BALL FIRST", "q": "The ball is loose. What should our player go for first: the ball or their player?", "a": "The ball! Get to it first, THEN shield your player off it. If you're far from the ball, he just runs around you.", "week": false, "fu": "v2/c5_front.mp4", "bu": "v2/c5_back.mp4"}, {"n": 6, "one": "Talk! Tell them what you see.", "ring": true, "hint": "", "cue": "TALK", "q": "Ryan has the ball 1-on-1. That's the matchup we wanted. What could a teammate shout to help him?", "a": "Tell him what you see! \"Time!\", \"Man on!\", or \"Take him on!\" Talking helps your teammate decide fast.", "week": false, "fu": "v2/c6_front.mp4", "bu": "v2/c6_back.mp4"}, {"n": 7, "one": "Stand in between. Force the mistake.", "ring": false, "hint": " Watch our players in white.", "cue": "PRESS", "q": "Their team has the ball. Where should our player stand to put on pressure?", "a": "In between their player and the pass. Stand in the gap and force the mistake.", "week": false, "fu": "v2/c7_front.mp4", "bu": "v2/c7_back.mp4"}, {"n": 8, "one": "Cutback coming? Get in the box, spread out.", "ring": false, "hint": " Watch our players in white.", "cue": "BOX", "q": "Tyler beats his man and cuts the ball back. Where should you be?", "a": "In front of goal and spread out: one near post, one in the middle, one at the back. Then the cutback finds someone.", "week": false, "fu": "v2/c8_front.mp4", "bu": "v2/c8_back.mp4"}, {"n": 9, "one": "Close the gaps. Stay together.", "ring": false, "hint": " Watch our players in white.", "cue": "GAPS", "q": "We just defended a corner, and Yo went up the field. Look at our players. What's the problem?", "a": "Big gaps between us! Move closer together and fill the hole until Yo gets back.", "week": false, "fu": "v2/c9_front.mp4", "bu": "v2/c9_back.mp4"}, {"n": 10, "one": "Win your battles. Don't quit.", "ring": false, "hint": " Watch the two players at the bottom.", "cue": "FIGHT", "q": "A 50-50 ball by the sideline. What do you do?", "a": "Go in strong and win it! Coach says that's what it takes: win the battles and don't quit.", "week": false, "fu": "v2/c10_front.mp4", "bu": "v2/c10_back.mp4"}];
const N=CARDS.length, WEEK=CARDS.filter(c=>c.week).length;
let cur=0, side='front', res={}; // res[i] = true (knew it) / false (not yet)
const st=()=>document.getElementById('stage');
function drawNav(){
  let h='';
  CARDS.forEach((c,i)=>{
    if(i===0)h+=`<div class="grp">This week</div>`;
    if(i===WEEK)h+=`<div class="grp">Bonus</div>`;
    const cls=[i===cur&&side!=='done'?'cur':'',res[i]===true?'ok':res[i]===false?'no':''].join(' ');
    const mark=res[i]===true?'✓':res[i]===false?'↺':'';
    h+=`<button class="${cls}" onclick="go(${i})" title="${c.cue}">${c.n}<span class="nm">${c.cue}</span><span class="st">${mark}</span></button>`;
  });
  document.getElementById('nav').innerHTML=h;
}
function nav2(){return `<div class="nav2"><button onclick="go(cur-1)" ${cur===0?'disabled':''}>← Back</button><span class="progress">Video ${cur+1} of ${N}</span><button onclick="go(cur+1)" ${cur===N-1?'disabled':''}>Skip →</button></div>`}
function go(i){if(i<0||i>=N)return;cur=i;showFront()}
function showFront(){
  side='front';drawNav();const c=CARDS[cur];
  st().innerHTML=`${nav2()}
  <div class="face"><video id="v" preload="auto" src="${c.fu}" muted playsinline autoplay></video>
  <div class="txt"><span class="tag">${c.n} · ${c.cue}</span><div class="q">${c.q}</div>
  <div class="hint">Watch until it freezes.${c.ring?' The yellow circle is the ball.':''}${c.hint} Say your answer out loud!</div></div></div>
  <div class="ctl"><button class="g" onclick="replay()">↺ Watch again</button><button class="w" onclick="showBack()">See answer →</button></div>`;
}
function replay(){const v=document.getElementById('v');v.currentTime=0;v.play()}
function showBack(){
  side='back';drawNav();const c=CARDS[cur];
  st().innerHTML=`${nav2()}
  <div class="face"><video src="${c.bu}" muted playsinline autoplay loop></video>
  <div class="txt"><span class="tag ans">${c.n} · ${c.cue}</span><div class="a">${c.a}</div>
  <div class="one"><div class="lbl">If you remember one thing, remember this</div><div class="big">${c.one}</div></div>
  <div class="hint">The video is what Coach drew.</div></div></div>
  <div class="ctl"><button class="g" onclick="showFront()">↺ Watch the play again</button><button class="yes" onclick="grade(true)">✓ I knew it</button><button class="no" onclick="grade(false)">↺ Not yet</button></div>`;
}
function grade(ok){
  res[cur]=ok;
  // cards 1-4 are this week's set; past that the set is all of them
  const end=cur<WEEK?WEEK:N, start=0;
  // next card in the set that isn't already a ✓ (so missed ones come back)
  for(let j=cur+1;j<end;j++)if(res[j]!==true){cur=j;return showFront()}
  for(let j=start;j<end;j++)if(!(j in res)){cur=j;return showFront()}
  showDone(end===WEEK);
}
function showDone(weekOnly){
  side='done';drawNav();
  const set=weekOnly?CARDS.slice(0,WEEK):CARDS;
  const misses=set.filter(c=>res[c.n-1]===false);
  const got=set.length-misses.length;
  st().innerHTML=`<div class="done"><div class="big">🏆</div>
    <div class="q">${weekOnly?"This week's "+WEEK+" done!":"All "+N+" done!"} You knew ${got} of ${set.length}.</div>
    <div class="ones"><b>Remember:</b><br>${set.map(c=>`${c.n}. ${c.one}`).join('<br>')}</div>
    <div class="q" style="font-size:18px">Before you play, ask yourself:<br>Where am I? What's my job? What can I see early?</div>
    <div class="ctl">
      ${misses.length?`<button class="no" onclick="go(${misses[0].n-1})">↺ Try the ${misses.length} I missed</button>`:''}
      ${weekOnly?`<button class="w" onclick="go(${WEEK})">Keep going: bonus ${WEEK+1}–${N} →</button>`:''}
      <button class="g" onclick="res={};go(0)">Start over</button>
    </div></div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
go(0);
</script>

</body></html>
